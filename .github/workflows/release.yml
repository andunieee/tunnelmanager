name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3, got '$GITHUB_REF_NAME'"
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Stamp Cargo version
        run: |
          sed -i.bak 's/^version = "[^"]*"$/version = "${{ steps.version.outputs.name }}"/' Cargo.toml
          rm -f Cargo.toml.bak
          grep -q "^version = \"${{ steps.version.outputs.name }}\"$" Cargo.toml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # android-actions/setup-android is broken (tries to install the
      # long-gone "tools" package), so install cmdline-tools directly.
      - name: Setup Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm cmdtools.zip
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"

      - name: Add Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0 --locked

      - name: Restore signing key
        run: |
          if [ -z "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # cargo-apk signs the release APK itself during the build; the
      # keystore comes from the environment (no manifest changes needed).
      - name: Build signed release APK
        env:
          ANDROID_PLATFORM: android-35
          ANDROID_BUILD_TOOLS_VERSION: 35.0.0
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: cargo apk build --release --lib -p flipflop

      - name: Verify APK signature
        run: |
          # NOTE: target/release/apk also holds an unsigned *-unaligned.apk
          # intermediate (plus .idsig sidecar) — verify the exact signed APK.
          apk=target/release/apk/flipflop.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          mkdir dist
          cp "$apk" "dist/flipflop-${{ steps.version.outputs.name }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  desktop:
    name: desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            slug: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            slug: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            slug: macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3, got '$GITHUB_REF_NAME'"
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Stamp Cargo version
        shell: bash
        run: |
          sed -i.bak 's/^version = "[^"]*"$/version = "${{ steps.version.outputs.name }}"/' Cargo.toml
          rm -f Cargo.toml.bak
          grep -q "^version = \"${{ steps.version.outputs.name }}\"$" Cargo.toml

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig-dev libssl-dev clang ninja-build

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir dist
          tar -czf "dist/flipflop-${{ steps.version.outputs.name }}-${{ matrix.slug }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" flipflop

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          mkdir dist
          Compress-Archive -Path "target/${{ matrix.target }}/release/flipflop.exe" `
            -DestinationPath "dist/flipflop-${{ steps.version.outputs.name }}-${{ matrix.slug }}.zip"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/*

  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3, got '$GITHUB_REF_NAME'"
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Stamp Cargo version
        shell: bash
        run: |
          sed -i.bak 's/^version = "[^"]*"$/version = "${{ steps.version.outputs.name }}"/' Cargo.toml
          rm -f Cargo.toml.bak
          grep -q "^version = \"${{ steps.version.outputs.name }}\"$" Cargo.toml

      # Uploads the bundle as an artifact itself, which the release job picks up.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/com.flipflop.app.yml
          bundle: flipflop-${{ steps.version.outputs.name }}-linux-x86_64.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

  release:
    needs: [android, desktop, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls dist
          gh release create "$GITHUB_REF_NAME" dist/*
